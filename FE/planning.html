<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta and Title -->
        <meta charset="UTF-8" />
        <title>Planning</title>

        <!-- Styles -->
        <link rel="stylesheet" href="./css/planning.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- jQuery for .load() -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- JS Scripts -->
        <script defer src="./js/planning.js"></script>
        <script type="module" src="./js/show-navigation.js"></script>
        <link rel="stylesheet" href="./css/navbar.css" />
    </head>

    <body>
        <div class="header"></div>
        <main>
            <form id="enterData">
                <h2>Enter Budget</h2>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="0.00"
                    required
                />

                <select id="category">
                    <option value="">Category</option>
                    <option value="REST">Food</option>
                    <option value="TRPT">Transport</option>
                    <option value="HOME">Household</option>
                    <option value="HLTH">Health</option>
                    <option value="EDUC">Education</option>
                    <option value="CLTH">Clothes</option>
                    <option value="SPRT">Lifestyle</option>
                </select>

                <input type="hidden" id="month" name="month" />

                <button id="enter" type="submit">Enter</button>
            </form>

            <section class="recent-entries">
                <h2>Budgets for the month</h2>
                <ul id="entriesList">
                </ul>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/show-navigation.js"></script>
    </body>
</html>
