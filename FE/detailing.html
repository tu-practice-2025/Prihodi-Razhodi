<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Category: Food</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 text-gray-800">
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto py-6 px-4">
                <h1 class="text-3xl font-bold">Category: Food</h1>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-6">
            <!-- Summary Card -->
            <div
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8"
            >
                <div class="bg-white p-6 rounded-2xl shadow">
                    <h2 class="text-lg font-semibold text-gray-600 mb-2">
                        Total Spent
                    </h2>
                    <p class="text-3xl font-bold text-green-600">$245.32</p>
                </div>
            </div>

            <!-- Transactions Table -->
            <div class="bg-white p-6 rounded-2xl shadow">
                <h2 class="text-xl font-semibold mb-4">Latest Transactions</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm text-left">
                        <thead
                            class="bg-gray-100 text-gray-600 uppercase text-xs"
                        >
                            <tr>
                                <th class="px-4 py-2">Date</th>
                                <th class="px-4 py-2">Description</th>
                                <th class="px-4 py-2">Amount</th>
                                <th class="px-4 py-2">Payment</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr class="hover:bg-gray-50">
                                <td class="px-4 py-2">2025-06-10</td>
                                <td class="px-4 py-2">Groceries - Walmart</td>
                                <td
                                    class="px-4 py-2 text-green-700 font-semibold"
                                >
                                    $65.40
                                </td>
                                <td class="px-4 py-2">Credit Card</td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="px-4 py-2">2025-06-07</td>
                                <td class="px-4 py-2">Lunch - Subway</td>
                                <td
                                    class="px-4 py-2 text-green-700 font-semibold"
                                >
                                    $12.25
                                </td>
                                <td class="px-4 py-2">Cash</td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="px-4 py-2">2025-06-04</td>
                                <td class="px-4 py-2">
                                    Dinner - Italian Bistro
                                </td>
                                <td
                                    class="px-4 py-2 text-green-700 font-semibold"
                                >
                                    $48.00
                                </td>
                                <td class="px-4 py-2">Debit</td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="px-4 py-2">2025-06-01</td>
                                <td class="px-4 py-2">Coffee - Starbucks</td>
                                <td
                                    class="px-4 py-2 text-green-700 font-semibold"
                                >
                                    $6.20
                                </td>
                                <td class="px-4 py-2">Mobile Pay</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </body>
</html>
