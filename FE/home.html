<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/home.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="./js/charts.js"></script>
    <script type="module" src="./js/show-navigation.js"></script>
    <script type="module" src="./js/home.js"></script>
    <script type="module" src="./js/data/filters.js"></script>
    <script type="module" src="./js/data/hooks.js"></script>
    <link rel="stylesheet" href="css/navbar.css" />
  </head>

  <body>
    <div class="header"></div>
    <div class="dashboard">
      <!-- Summary Cards -->
      <div class="summary-cards">
        <a href="income.html" class="card-link">
          <div class="card income">
            <div class="card-icon">$</div>
            <div class="card-content">
              <h4>Income</h4>
              <p id="incomeDisplay"></p>
            </div>
          </div>
        </a>
        <a href="expenses.html" class="card-link">
          <div class="card expenses">
            <div class="card-icon">$</div>
            <div class="card-content">
              <h4>Expenses</h4>
              <p id="expensesDisplay"></p>
            </div>
          </div>
        </a>
        <a href="balance.html" class="card-link">
          <div class="card balance">
            <div class="card-icon">$</div>
            <div class="card-content">
              <h4>Balance</h4>
              <p id="balanceDisplay"></p>
            </div>
          </div>
        </a>
      </div>

      <div class="main-grid">
        <div class="left-side">
          <div class="chart-container">
            <h4>Income & Expenses</h4>
            <div class="chart-placeholder">
              <canvas id="lineChart"></canvas>
            </div>
          </div>
        </div>
        <div class="right-side">
          <div class="chart-container">
            <h4>Expenses by Category</h4>
            <div class="chart-placeholder pie-placeholder">
              <canvas id="pieChart"></canvas>
            </div>
          </div>
        </div>

        <div class="quick-access mt-4">
          <h4>Quick access</h4>
          <div class="button-group">
            <button>Send report</button>
            <button id="openInsightsBtn" class="insights-button">
              Financial Advisor
            </button>
          </div>

          <div id="insightsModal" class="modal">
            <div class="modal-content">
              <span id="closeModalBtn" class="close">&times;</span>
              <h2>Your Insights ✨</h2>
              <div class="stars-container">
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
              </div>
              <div id="insightsContent">
                <p>Loading insights...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/show-navigation.js"></script>
  </body>
</html>
