<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Income Page</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/navbar.css" />
        <link rel="stylesheet" href="css/income.css" />
        <link rel="stylesheet" href="css/home.css" />
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script type="module" src="./js/show-navigation.js"></script>
    </head>
    <body>
        <div class="header"></div>

        <div class="container mt-4">
            <h2 class="mb-4 text-center" id="incomeHeading">Income Overview</h2>

            <!-- Chart Section -->
            <div class="card mb-4">
                <div class="card-body">
                    <canvas id="incomeChart" height="100"></canvas>
                </div>
            </div>

            <!-- Latest Transactions Table -->
            <div class="card">
                <div class="card-body">
                    <h5 class="text-center fw-bold mb-3">
                        Latest Income Transactions
                    </h5>
                    <div class="table-responsive">
                        <table
                            class="table table-striped text-center align-middle"
                        >
                            <thead class="table-dark">
                                <tr>
                                    <th>Date</th>
                                    <th>Source</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="incomeTableBody">
                                <!-- Populated by income.js -->
                            </tbody>
                        </table>

                        <!-- Action Button -->
                        <div class="button-group mt-4">
                            <button>Show more transactions</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="js/show-navigation.js"></script>
        <script src="js/income.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
